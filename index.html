<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}

.bunt{display:block;width:100%;max-width:560px;margin:0 auto}

.env i{position:absolute;inset:0;border-radius:10px;display:block}
.env .f1{background:#ffc1d7;clip-path:polygon(0 0,52% 58%,0 100%)}
.env .f2{background:#ffcadd;clip-path:polygon(100% 0,48% 58%,100% 100%)}
.env .f3{background:#ffa8c7;clip-path:polygon(0 100%,50% 50%,100% 100%)}
.env .flap{position:absolute;left:0;right:0;top:0;height:64px;background:linear-gradient(180deg,#ff9ec0,#ffb0cb);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .55s;z-index:3;border-radius:10px 10px 0 0}
.env .seal{position:absolute;left:50%;top:42px;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;background:#ff4f8b;color:#fff;font-size:17px;display:grid;place-items:center;z-index:4;box-shadow:0 3px 6px rgba(0,0,0,.25),inset 0 -3px 0 #d63a74;transition:opacity .3s}
.env.open .flap{transform:rotateX(180deg);z-index:0;background:#ffc3d8}
.env.open .paper{transform:translateY(-30px)}
.env.open .seal{opacity:0}

.new{position:absolute;top:22px;right:4px;background:#ff4f8b;color:#fff;font-size:11px;padding:2px 9px;border-radius:99px;z-index:6;animation:pulse 1.6s infinite}

.empty{text-align:center;color:var(--soft);padding:50px 10px;font-size:18px}
.ov{position:fixed;inset:0;background:rgba(110,30,70,.55);backdrop-filter:blur(3px);z-index:20;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 12px calc(30px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:flex-start}

.mus .disc{font-size:32px;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bqw{text-align:center;margin-top:8px}
.bqw small{display:block;color:#a6708a}
.bq{width:260px;max-width:100%;height:auto;display:block;margin:0 auto;filter:drop-shadow(0 6px 6px rgba(255,110,165,.25))}
.sec{background:var(--bg);border-radius:16px;padding:4px 12px 12px;margin-top:10px}
.lab{display:block;font-weight:600;margin:12px 0 6px}

.pick{display:flex;flex-wrap:wrap;gap:6px}

.pick button.on{border-color:var(--pink);background:var(--pink2)}
.pick .col{width:34px;height:34px;border-radius:50%;padding:0;font-size:0;border:3px solid var(--line)}

.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.thumbs button{position:absolute;top:-6px;right:-6px;border:0;background:#ff4f8b;color:#fff;border-radius:50%;width:22px;height:22px;font-size:13px}
.note{font-size:13px;color:var(--soft)}
.player{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--pink2);border-radius:99px;padding:6px 8px 6px 12px;box-shadow:0 6px 16px var(--shadow);font-size:12px;line-height:1.3;max-width:calc(100% - 24px)}
.player .pd{font-size:26px}.player.on .pd{animation:spin 4s linear infinite}
.player button{border:0;background:var(--pink);color:#fff;width:36px;height:36px;border-radius:50%;font-size:13px;flex:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#5a2e44;color:#fff;padding:10px 18px;border-radius:99px;z-index:50;max-width:90%;text-align:center}
</style>
</head>

  $('#nm').textContent='🎀 '+cfg.name+' 🎀';document.title='Congratulations '+cfg.name+' 🎓';
  const unread=letters.filter(l=>!isRead(l)).length;
  $('#sub').textContent=isAdmin?(letters.length?`มีจดหมาย ${letters.length} ฉบับ · ยังไม่ได้เปิด ${unread} ฉบับ 💌`:'ยังไม่มีจดหมายเข้ามา 💌'):(letters.length?`มีจดหมายแล้ว ${letters.length} ฉบับ 💌 เนื้อหาเป็นความลับ พี่นมเท่านั้นที่เปิดอ่านได้`:'ฝากความรักและคำอวยพรไว้ในซองจดหมาย 💌 (พี่นมเท่านั้นที่เปิดอ่านได้)');
  const mine=letters.find(l=>l.id===uid);
  $('#bar').innerHTML=(db&&uid?`<button class="btn" id="wr">${mine?'✏️ แก้ไขจดหมายของฉัน':'💌 เขียนจดหมาย'}</button>`:(db&&authError?`<div class="note" style="max-width:420px">⚠️ เขียนจดหมายยังไม่ได้: ${esc(authError)}</div>`:''));
  if($('#wr'))$('#wr').onclick=async()=>{if(!mine)return editor();try{const c=(await getDoc(doc(db,'contents',uid))).data()||{};editor({...mine,...c})}catch(e){toast('โหลดจดหมายไม่ได้')}};
  e.hidden=!!letters.length;
  if(!letters.length)e.textContent=ready?(isAdmin?'ยังไม่มีจดหมายเข้ามา 🌷':'มาเป็นคนแรกที่เขียนจดหมายถึงพี่นมกันเถอะ 🌷'):'กำลังโหลด… 🌸';
  g.innerHTML=letters.map((l,i)=>{const r=isRead(l);return `<div class="cell">${(r||!isAdmin)?'':'<span class="new">ใหม่!</span>'}
  <div class="sway" style="--d:-${(i*0.7)%4}s"><button class="env ${r?'open':''}" data-o="${esc(l.id)}" aria-label="จดหมายจาก ${esc(l.sender)}"><div class="body"></div><div class="paper"></div><i class="f1"></i><i class="f2"></i><i class="f3"></i><div class="flap"></div><div class="seal">♥</div>${l.stk?`<span class="stk">${esc(l.stk)}</span>`:''}</button></div>
  <div class="from">💌 จาก ${esc(l.sender)}</div>
  ${isAdmin?`<button class="mini del" data-d="${esc(l.id)}">${armed===l.id?'แตะอีกครั้งเพื่อลบ':'🗑 ลบ'}</button>`:''}</div>`}).join('');
  g.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>openLetter(b.dataset.o));
  g.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{const id=b.dataset.d;if(armed!==id){armed=id;render();setTimeout(()=>{if(armed===id){armed=null;render()}},4000);return}armed=null;try{await dbDelete(id);toast('ลบแล้ว')}catch(er){toast('ลบไม่ได้')}});
}
function letterHTML(l){
  const st=(l.stickers||[]).map((s,i)=>`<span class="st" style="left:${SLOTS[i%8][0]}%;top:${SLOTS[i%8][1]}%;transform:rotate(${(i*37%40)-20}deg)">${s}</span>`).join('');
  const ph=(l.photos||[]).length?`<div class="pols">${l.photos.map((p,i)=>`<div class="pol" style="transform:rotate(${[-4,3,-2,4,-3][i%5]}deg)"><img src="${esc(p)}" alt=""></div>`).join('')}</div>`:'';
  const ok=/^https?:\/\//.test((l.music&&l.music.u)||'');
  const m=l.music&&l.music.t?(ok?`<a class="mus" href="${esc(l.music.u)}" target="_blank" rel="noopener noreferrer">`:'<div class="mus">')+`<span class="disc">💿</span><span><b>🎵 ${esc(l.music.t)}</b>${l.music.a?'<br>'+esc(l.music.a):''}${ok?'<br><small>แตะเพื่อฟังเพลง ▶</small>':''}</span>`+(ok?'</a>':'</div>'):'';
  return `<div class="letter" style="background-color:${esc(l.paper||'#fff')}">${st}<div class="to">ถึง ${esc(cfg.name)} 💕</div><div class="msg">${esc(l.msg)}</div>${ph}<div class="div">♡ ♡ ♡</div>${m}${bouquet(l.flowers)}<div class="sig"><b>${esc(l.sender)}</b> 🌷</div></div>`}
function showModal(inner){const m=$('#modal');m.innerHTML=`<div class="ov"><div class="sheet"><button class="x" aria-label="ปิด">×</button>${inner}</div></div>`;m.querySelector('.x').onclick=closeM;m.querySelector('.ov').onclick=e=>{if(e.target.classList.contains('ov')&&!m.querySelector('[data-edit]'))closeM()}}
function closeM(){$('#modal').innerHTML=''}
async function openLetter(id){const l=letters.find(x=>x.id===id);if(!l)return;
  if(!isAdmin&&id!==uid){showModal(`<div style="text-align:center;padding:28px 10px 14px"><div style="font-size:56px">🔒</div><p style="font-size:17px">จดหมายจาก <b>${esc(l.sender)}</b><br>เป็นความลับ พี่นมเท่านั้นที่เปิดอ่านได้ 💗</p></div>`);return}
  let c;try{c=(await getDoc(doc(db,'contents',id))).data()}catch(e){toast('เปิดจดหมายไม่ได้');return}
  if(!c){toast('ไม่พบเนื้อหาจดหมาย');return}
  readMap[id]=l.ts||0;saveRead();showModal(letterHTML({...l,...c}));render()}
function editor(ex){
  const d=ex?JSON.parse(JSON.stringify(ex)):{sender:'',msg:'',photos:[],music:{t:'',a:'',u:''},flowers:[],stickers:[],paper:'#ffeef4'};
  d.music=d.music||{t:'',a:'',u:''};d.flowers=(d.flowers||[]).map(x=>LEG[x]||x).filter(k=>FD[k]);
  showModal(`<div data-edit style="padding:8px 6px 0"><h3 style="margin:6px 0 0">${ex?'แก้ไขจดหมาย':'เขียนจดหมายใหม่'} 💌</h3>
  <div class="sec"><span class="lab">1 · จากใคร 🌸 (ชื่อที่จะโชว์บนซอง)</span><input type="text" id="f_s" maxlength="30" value="${esc(d.sender)}"></div>
  <div class="sec"><span class="lab">2 · ข้อความถึง${esc(cfg.name)} 💕</span><textarea id="f_m" maxlength="900">${esc(d.msg)}</textarea></div>
  <div class="sec"><span class="lab">3 · รูปภาพ 📷 (1–5 รูป) <span class="note" id="pc"></span></span><input type="file" id="f_p" accept="image/*" multiple><div class="thumbs" id="th"></div></div>
  <div class="sec"><span class="lab">4 · เพลงฝากถึงพี่ 🎵</span><input type="text" id="f_mt" placeholder="ชื่อเพลง" maxlength="60" value="${esc(d.music.t)}" style="margin-bottom:6px"><input type="text" id="f_ma" placeholder="ศิลปิน" maxlength="60" value="${esc(d.music.a)}" style="margin-bottom:6px"><input type="url" id="f_mu" placeholder="ลิงก์เพลง YouTube / Spotify (ไม่ใส่ก็ได้)" value="${esc(d.music.u)}"></div>
  <div class="sec"><span class="lab">5 · DIY ช่อดอกไม้ 💐 <span class="note" id="fc"></span></span><div class="pick" id="fp">${FKEYS.map(k=>`<button type="button" class="fb" data-f="${k}"><svg viewBox="-32 -38 64 64" width="44" height="44">${FD[k].s()}</svg>${FD[k].n}</button>`).join('')}</div><p style="margin:6px 0"><button type="button" class="mini" id="fu">↩︎ ลบดอกล่าสุด</button></p><div id="fv"></div></div>
  <div class="sec"><span class="lab">6 · สีกระดาษ 🎨</span><div class="pick" id="pp">${PAPERS.map(p=>`<button type="button" class="col" data-c="${p}" style="background:${p}">${p}</button>`).join('')}</div>
  <span class="lab">สติกเกอร์/ตุ๊กตา 🧸 (สูงสุด 8)</span><div class="pick" id="sp">${STICKERS.map(s=>`<button type="button" data-s="${s}">${s}</button>`).join('')}</div></div>
  <p style="display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px"><button type="button" class="btn ghost" id="pv">👀 ดูตัวอย่าง</button><button type="button" class="btn" id="sv">ส่งจดหมาย 💗</button></p></div>`);
  const gather=()=>{d.sender=$('#f_s').value.trim();d.msg=$('#f_m').value;d.music={t:$('#f_mt').value.trim(),a:$('#f_ma').value.trim(),u:$('#f_mu').value.trim()}};
  const draw=()=>{
    $('#th').innerHTML=d.photos.map((p,i)=>`<div><img src="${esc(p)}" alt=""><button type="button" data-r="${i}">×</button></div>`).join('');
    $('#th').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{d.photos.splice(+b.dataset.r,1);draw()});
    $('#pc').textContent=`(${d.photos.length}/5)`;$('#fc').textContent=`(${d.flowers.length}/9)`;
    $('#fv').innerHTML=bouquet(d.flowers);
    document.querySelectorAll('#pp .col').forEach(b=>b.classList.toggle('on',b.dataset.c===d.paper));
    document.querySelectorAll('#sp [data-s]').forEach(b=>b.classList.toggle('on',d.stickers.includes(b.dataset.s)));
  };
  document.querySelectorAll('#fp [data-f]').forEach(b=>b.onclick=()=>{if(d.flowers.length<9){d.flowers.push(b.dataset.f);draw()}else toast('ช่อเต็มแล้ว 💐')});
  $('#fu').onclick=()=>{d.flowers.pop();draw()};
  document.querySelectorAll('#pp .col').forEach(b=>b.onclick=()=>{d.paper=b.dataset.c;draw()});
  document.querySelectorAll('#sp [data-s]').forEach(b=>b.onclick=()=>{const s=b.dataset.s,i=d.stickers.indexOf(s);if(i>=0)d.stickers.splice(i,1);else if(d.stickers.length<8)d.stickers.push(s);else toast('ครบ 8 ชิ้นแล้ว');draw()});
  $('#f_p').onchange=async e=>{for(const f of [...e.target.files]){if(d.photos.length>=5){toast('ใส่ได้ไม่เกิน 5 รูป');break}try{d.photos.push(await shrink(f))}catch(er){toast('อ่านรูปไม่ได้')}}e.target.value='';draw()};
  $('#pv').onclick=()=>{gather();const keep=JSON.parse(JSON.stringify(d));showModal(letterHTML({...keep,sender:keep.sender||'ชื่อของคุณ',msg:keep.msg||'…'})+`<p style="text-align:center"><button class="btn" id="bk">← กลับไปแก้</button></p>`);$('#bk').onclick=()=>editor(keep)};
  $('#sv').onclick=async()=>{gather();
    if(!d.sender)return toast('ใส่ชื่อก่อนนะ 🌸');if(!d.msg.trim())return toast('เขียนข้อความก่อนนะ 💌');
    if(!d.photos.length)return toast('ใส่รูปอย่างน้อย 1 รูปนะ 📷');
    if(d.photos.join('').length>200000)return toast('รูปใหญ่เกินไป ลองลดจำนวนรูป');
    if(d.music.u&&!/^https?:\/\//.test(d.music.u))return toast('ลิงก์เพลงต้องขึ้นต้นด้วย https://');
    try{await dbSaveLetter({uid,sender:d.sender,msg:d.msg,photos:d.photos,music:d.music,flowers:d.flowers,stickers:d.stickers,paper:d.paper,ts:Date.now()});closeM();toast('ส่งจดหมายแล้ว 💗')}
    catch(er){toast('บันทึกไม่ได้ — อาจยังไม่มีสิทธิ์เขียน')}};
  draw();
}
function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const M=380,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.55))};im.onerror=rej;im.src=u})}
function offline(e){ready=true;$('#empty').hidden=false;$('#empty').textContent='เชื่อมต่อฐานข้อมูลไม่ได้ 🌸'+(e&&e.code?' ('+e.code+')':' (หมดเวลารอ)')}
render();
async function dbDelete(id){const b=writeBatch(db);b.delete(doc(db,'letters',id));b.delete(doc(db,'contents',id));await b.commit()}
async function dbSaveLetter(o){const b=writeBatch(db);
  b.set(doc(db,'letters',uid),{uid,sender:o.sender,ts:o.ts,stk:(o.stickers||[])[0]||''});
  b.set(doc(db,'contents',uid),{uid,msg:o.msg,photos:o.photos,music:o.music,flowers:o.flowers,stickers:o.stickers,paper:o.paper,ts:o.ts});
  await b.commit()}
const tm=setTimeout(()=>{if(!ready)offline()},15000);
async function checkAdmin(){isAdmin=false;if(uid){try{isAdmin=(await getDoc(doc(db,'admins',uid))).exists()}catch(e){}}$('#al').textContent=isAdmin?'🚪 ออกจากโหมดแอดมิน':'🔑 แอดมิน';render()}
$('#al').textContent='🔑 แอดมิน';
$('#al').onclick=async()=>{
  if(isAdmin){try{await deleteDoc(doc(db,'admins',uid))}catch(e){}checkAdmin();return}
  showModal('<span class="lab">🔑 รหัสแอดมิน (สำหรับลบจดหมาย)</span><input type="password" id="ap" autocomplete="off"><p><button class="btn" id="ao">เข้าสู่โหมดแอดมิน</button></p>');
  $('#ao').onclick=async()=>{try{await setDoc(doc(db,'admins',uid),{pw:$('#ap').value});closeM();await checkAdmin();toast('เข้าโหมดแอดมินแล้ว 🔓')}catch(e){toast('รหัสไม่ถูกต้อง')}}};
// ---- music ----
const au=$('#au'),pb=$('#pb');let userPaused=false;
const sync=()=>{const on=!au.paused;$('#pl').classList.toggle('on',on);pb.textContent=on?'❚❚':'▶'};
au.addEventListener('play',sync);au.addEventListener('pause',sync);
pb.addEventListener('pointerdown',e=>e.stopPropagation());
pb.onclick=()=>{if(au.paused){userPaused=false;au.play().catch(()=>{})}else{userPaused=true;au.pause()}};
au.play().catch(()=>{document.addEventListener('pointerdown',()=>{if(!userPaused&&au.paused)au.play().catch(()=>{})},{once:true})});
// ---- firebase ----
const app=initializeApp(firebaseConfig),auth=getAuth(app);
db=getFirestore(app);
onAuthStateChanged(auth,u=>{uid=u?u.uid:null;checkAdmin()});
onSnapshot(collection(db,'letters'),q=>{clearTimeout(tm);ready=true;letters=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ts||0)-(b.ts||0));render()},e=>offline(e));
(async()=>{try{await auth.authStateReady();if(!auth.currentUser)await signInAnonymously(auth)}catch(e){authError=(e&&e.code)||String(e);render()}})();
if(location.protocol==='file:'){authError='เปิดไฟล์จากเครื่องโดยตรงไม่ได้ ต้องเปิดผ่านลิงก์ github.io';render()}
</script>
</body>
</html>
